[package]
name = "jd"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ejfkdev/jd"
description = "Multi-language deobfuscation framework. Rust port of webcrack, synchrony, and disrobe."
keywords = ["javascript", "deobfuscator", "obfuscator-io", "reverse-engineering", "security"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jd"
path = "src/main.rs"

[dependencies]
oxc = "0.40"
oxc_allocator = "0.40"
oxc_parser = "0.40"
oxc_ast = "0.40"
oxc_span = "0.40"
oxc_semantic = "0.40"
oxc_codegen = "0.40"
boa_engine = "0.20"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasmparser = "0.256"
classfile-parser = "0.3"
